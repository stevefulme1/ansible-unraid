---
# tasks/main.yml for unraid_share_setup
# Configure user shares, SMB/NFS access, and cache settings

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - unraid_share_setup_host | length > 0
      - unraid_share_setup_api_key | length > 0
    fail_msg: >-
      unraid_share_setup_host and unraid_share_setup_api_key must be defined.
    quiet: true

- name: Build authentication parameters
  ansible.builtin.set_fact:
    _unraid_auth:
      host: "{{ unraid_share_setup_host }}"
      api_key: "{{ unraid_share_setup_api_key }}"
      validate_certs: "{{ unraid_share_setup_validate_certs }}"
  no_log: true

- name: Configure shares
  block:
    - name: Create user shares
      stevefulme1.unraid.share:
        host: "{{ _unraid_auth.host }}"
        api_key: "{{ _unraid_auth.api_key }}"
        validate_certs: "{{ _unraid_auth.validate_certs }}"
        name: "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        use_cache: "{{ item.use_cache | default('prefer') }}"
        include_disks: "{{ item.include_disks | default([]) }}"
        exclude_disks: "{{ item.exclude_disks | default([]) }}"
        split_level: "{{ item.split_level | default('auto') }}"
        allocation_method: "{{ item.allocation_method | default('highwater') }}"
        floor: "{{ item.floor | default('0') }}"
        cow: "{{ item.cow | default('auto') }}"
        state: present
      loop: "{{ unraid_share_setup_shares }}"
      when: unraid_share_setup_shares | length > 0

    - name: Configure SMB global settings
      stevefulme1.unraid.smb_config:
        host: "{{ _unraid_auth.host }}"
        api_key: "{{ _unraid_auth.api_key }}"
        validate_certs: "{{ _unraid_auth.validate_certs }}"
        enabled: "{{ unraid_share_setup_smb_config.enabled }}"
        workgroup: "{{ unraid_share_setup_smb_config.workgroup | default(omit) }}"
        local_master: "{{ unraid_share_setup_smb_config.local_master | default(omit) }}"
        enhanced_macOS: "{{ unraid_share_setup_smb_config.enhanced_macOS | default(omit) }}"
        state: present

    - name: Configure SMB share exports
      stevefulme1.unraid.share:
        host: "{{ _unraid_auth.host }}"
        api_key: "{{ _unraid_auth.api_key }}"
        validate_certs: "{{ _unraid_auth.validate_certs }}"
        name: "{{ item.name }}"
        smb_security: "{{ item.security | default('private') }}"
        smb_export: "{{ item.export | default('yes') }}"
        smb_valid_users: "{{ item.valid_users | default(omit) }}"
        state: present
      loop: "{{ unraid_share_setup_smb_shares }}"
      when: unraid_share_setup_smb_shares | length > 0

    - name: Configure NFS global settings
      stevefulme1.unraid.nfs_config:
        host: "{{ _unraid_auth.host }}"
        api_key: "{{ _unraid_auth.api_key }}"
        validate_certs: "{{ _unraid_auth.validate_certs }}"
        enabled: "{{ unraid_share_setup_nfs_config.enabled | default(false) }}"
        tuning_enabled: "{{ unraid_share_setup_nfs_config.tuning_enabled | default(false) }}"
        count: "{{ unraid_share_setup_nfs_config.count | default(8) }}"
        state: present
      when: unraid_share_setup_nfs_config.enabled | default(false)

    - name: Configure NFS share exports
      stevefulme1.unraid.share:
        host: "{{ _unraid_auth.host }}"
        api_key: "{{ _unraid_auth.api_key }}"
        validate_certs: "{{ _unraid_auth.validate_certs }}"
        name: "{{ item.name }}"
        nfs_security: "{{ item.security | default('public') }}"
        nfs_export: "{{ item.export | default('yes') }}"
        nfs_rule: "{{ item.rule | default(omit) }}"
        state: present
      loop: "{{ unraid_share_setup_nfs_shares }}"
      when: unraid_share_setup_nfs_shares | length > 0

    - name: Configure cache mover
      stevefulme1.unraid.cache_mover:
        host: "{{ _unraid_auth.host }}"
        api_key: "{{ _unraid_auth.api_key }}"
        validate_certs: "{{ _unraid_auth.validate_certs }}"
        schedule_enabled: "{{ unraid_share_setup_cache_mover.schedule_enabled }}"
        schedule: "{{ unraid_share_setup_cache_mover.schedule | default('40 3 * * *') }}"
        action: "{{ unraid_share_setup_cache_mover.action | default('auto') }}"
        state: present

    - name: Configure notification agents
      stevefulme1.unraid.notification_agent:
        host: "{{ _unraid_auth.host }}"
        api_key: "{{ _unraid_auth.api_key }}"
        validate_certs: "{{ _unraid_auth.validate_certs }}"
        agent: "{{ item.agent }}"
        name: "{{ item.name }}"
        events: "{{ item.events | default([]) }}"
        state: present
      loop: "{{ unraid_share_setup_notifications }}"
      when: unraid_share_setup_notifications | length > 0

  rescue:
    - name: Share configuration failed
      ansible.builtin.fail:
        msg: >-
          Unraid share configuration failed:
          {{ ansible_failed_result.msg | default('unknown error') }}
