---
# tasks/main.yml for unraid_backup_setup
# Configure backup schedules

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - unraid_backup_setup_host is defined
    fail_msg: "unraid_backup_setup_host must be defined"
    quiet: true

- name: Execute unraid backup setup
  ansible.builtin.debug:
    msg: >-
      Configure backup schedules.
      Target: {{ unraid_backup_setup_host }}
