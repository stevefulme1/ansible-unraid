---
# Integration tests for stevefulme1.unraid.update_info

- name: Query update_info
  stevefulme1.unraid.update_info:
    api_url: "{{ unraid_api_url }}"
    api_key: "{{ unraid_api_key }}"
    validate_certs: "{{ unraid_validate_certs | default(true) }}"
  register: result

- name: Verify update_info returns data
  ansible.builtin.assert:
    that:
      - result is not failed
