---
# Integration tests for stevefulme1.unraid.notification_agent

- name: Run notification_agent (check_mode)
  stevefulme1.unraid.notification_agent:
    agent: email
    api_url: "{{ unraid_api_url }}"
    api_key: "{{ unraid_api_key }}"
    validate_certs: "{{ unraid_validate_certs | default(true) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
