---
# Integration tests for stevefulme1.unraid.array_disk

- name: Run array_disk (check_mode)
  stevefulme1.unraid.array_disk:
    action: add
    id: "ansible-test-id"
    api_url: "{{ unraid_api_url }}"
    api_key: "{{ unraid_api_key }}"
    validate_certs: "{{ unraid_validate_certs | default(true) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
