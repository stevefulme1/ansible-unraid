---
# Integration tests for stevefulme1.unraid.disk

- name: Query disk info
  stevefulme1.unraid.disk_info:
    api_url: "{{ unraid_api_url }}"
    api_key: "{{ unraid_api_key }}"
    validate_certs: "{{ unraid_validate_certs | default(true) }}"
  register: info_result

- name: Verify disk info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run disk (check_mode)
  stevefulme1.unraid.disk:
    id: "ansible-test-id"
    api_url: "{{ unraid_api_url }}"
    api_key: "{{ unraid_api_key }}"
    validate_certs: "{{ unraid_validate_certs | default(true) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
