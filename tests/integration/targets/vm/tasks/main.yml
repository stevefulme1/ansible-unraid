---
# Integration tests for stevefulme1.unraid.vm

- name: Query vm info
  stevefulme1.unraid.vm_info:
    api_url: "{{ unraid_api_url }}"
    api_key: "{{ unraid_api_key }}"
    validate_certs: "{{ unraid_validate_certs | default(true) }}"
  register: info_result

- name: Verify vm info
  ansible.builtin.assert:
    that:
      - info_result is not failed

- name: Run vm (check_mode)
  stevefulme1.unraid.vm:
    api_url: "{{ unraid_api_url }}"
    api_key: "{{ unraid_api_key }}"
    validate_certs: "{{ unraid_validate_certs | default(true) }}"
    name: "ansible-test-{{ resource_prefix }}"
  check_mode: true
  register: check_result

- name: Verify check_mode result
  ansible.builtin.assert:
    that:
      - check_result is not failed
