---
# Integration tests for stevefulme1.unraid.disk_temp_info

- name: Query disk_temp_info
  stevefulme1.unraid.disk_temp_info:
    api_url: "{{ unraid_api_url }}"
    api_key: "{{ unraid_api_key }}"
    validate_certs: "{{ unraid_validate_certs | default(true) }}"
  register: result

- name: Verify disk_temp_info returns data
  ansible.builtin.assert:
    that:
      - result is not failed
